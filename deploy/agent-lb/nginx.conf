# agent 双实例内部负载均衡（Java 只认识这一个地址）
#
# 关键：SSE 流式必须关闭一切缓冲与 keepalive 复用，否则响应会被攒住/串包，
# 表现为「agent 明明发出内容帧，Java 却收到空回复」。

upstream agent_backend {
    server agent:8001  max_fails=2 fail_timeout=10s;
    server agent2:8001 max_fails=2 fail_timeout=10s;
    # 不要 keepalive：SSE 长连接复用会与其他请求串包
}

server {
    listen 8001;
    client_max_body_size 8m;

    location / {
        proxy_pass http://agent_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection close;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # SSE：禁用缓冲 + 关闭缓存 + 拉长读超时
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        chunked_transfer_encoding on;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}