# agent 双实例内部负载均衡（Java 只认识这一个地址）
#
# 为什么需要：OFF 退役后 Java 不再有「整条链路回退」，agent 必须自身高可用。
# 这里用 nginx 做最小可用方案：被动健康检查（max_fails/fail_timeout），
# 一个实例挂了请求自动打到另一个；两个都挂才失败（此时 Java 侧仍有进程内兜底）。

upstream agent_backend {
    server agent:8001  max_fails=2 fail_timeout=10s;
    server agent2:8001 max_fails=2 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 8001;
    client_max_body_size 8m;

    # SSE 必须关闭缓冲，否则流式回复会被攒住
    proxy_buffering off;
    proxy_cache off;

    location / {
        proxy_pass http://agent_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 流式响应：不设短超时
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}