# agent 双实例内部负载均衡（Java 只认识这一个地址）
#
# 关键：SSE 流式必须关闭一切缓冲与 keepalive 复用，否则响应会被攒住/串包，
# 表现为「agent 明明发出内容帧，Java 却收到空回复」。

upstream agent_backend {
    server agent:8001  max_fails=2 fail_timeout=10s;
    server agent2:8001 max_fails=2 fail_timeout=10s;
    # 不要 keepalive：SSE 长连接复用会与其他请求串包
}

server {
    listen 8001;
    client_max_body_size 8m;

    location / {
        proxy_pass http://agent_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection close;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # 故障转移：连接失败/超时/502/503/504 自动换下一个后端。
        # 修「单实例故障时 50% 请求 502」——健康探测/短请求命中挂掉实例时，
        # nginx 会重试另一个活实例（POST 只在请求未发出时重试，语义安全）。
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        # 快速失败：连不上 3s 就换下一个，不吃 60s 默认连接超时
        proxy_connect_timeout 3s;

        # SSE：禁用缓冲 + 关闭缓存 + 拉长读超时
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        chunked_transfer_encoding on;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}