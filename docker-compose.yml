# LianYu-PC Docker Compose锛堜簯绔細api-gateway + backend + 涓棿浠讹紱鍓嶇浠?Electron 鏈湴鎵撳寘锛?
#
# 涓€閿惎鍔紙API 缃戝叧 + 鍚庣 + 鍏ㄩ儴涓棿浠讹級:
#   docker compose up -d --build
#
# 璁块棶:
#   API: https://localhost/api/  锛堢粡 api-gateway TLS 鍙嶄唬 backend:8080锛?
#   鏂囨。: https://localhost/doc.html
#
# 娓呭簱閲嶅缓锛堜細娓呯┖ MySQL/Redis/MinIO/Milvus/RabbitMQ 鏁版嵁锛?
#   docker compose down -v && docker compose up -d --build
#
# 浠呮湰鍦拌仈璋冪綉鍏筹紙鍙嶄唬瀹夸富鏈?5173/8080锛?
#   docker compose --profile dev-proxy up -d web-gateway

name: lianyu-pc

services:
  # 鍙€夛細鏈湴鑱旇皟缃戝叧锛堜笉鎵撳寘鍓嶅悗绔唬鐮侊級
  web-gateway:
    profiles: ["dev-proxy"]
    build:
      context: ./frontend
      dockerfile: Dockerfile.gateway
    image: lianyu-pc/web-gateway:dev
    container_name: lianyu-web-gateway
    restart: unless-stopped
    ports:
      - "${LIANYU_GATEWAY_PORT:-8088}:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # 鍚庣鏈嶅姟锛堥暅鍍忓唴鏋勫缓褰撳墠婧愮爜锛?
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        APP_REVISION: ${APP_REVISION:-dev}
    image: lianyu-pc/backend:${APP_REVISION:-dev}
    container_name: lianyu-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # 鐢熶骇瀹瑰櫒蹇呴』璺?prod profile锛堝叧鏂囨。 / WS origin 鐧藉悕鍗?/ prod CORS锛夛紱
      # 鏈湴 compose 鑱旇皟濡傞渶 dev 琛屼负锛屽湪 .env 瑕嗙洊 SPRING_PROFILES_ACTIVE=dev
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      MINIO_ENDPOINT: http://minio:9000
      MILVUS_HOST: milvus
      LIANYU_ASR_BASE_URL: http://asr:8080
      SERVER_PORT: 8080
      # OFF 宸查€€褰癸細agent 杩愯鏃跺缁堝惎鐢?
      # outbox 鎶曞奖鐢?Python relay 鐙崰锛堣蹇嗗煙鍗曞啓鑰咃級锛汮ava relay 淇濈暀浣嗛粯璁ゅ叧闂?
      LIANYU_MEMORY_OUTBOX_ENABLED: ${LIANYU_MEMORY_OUTBOX_ENABLED:-false}
      LIANYU_AGENT_BASE_URL: ${LIANYU_AGENT_BASE_URL:-http://agent-lb:8001}
      TZ: Asia/Shanghai
      # 涓?Dockerfile ENTRYPOINT 鍙屼繚闄╋細鍑虹珯浼樺厛 IPv4锛岄伩鍏?DashScope AAAA 涓嶉€氬鑷?TTS 澶辫触
      JAVA_TOOL_OPTIONS: "-Djava.net.preferIPv4Addresses=true"
    # 缁曡繃瀹夸富鏈?systemd-resolved 鎶栧姩锛歟mbedded 127.0.0.11 浠嶈В鏋?mysql/redis锛?
    # 鍑虹珯 DeepSeek/DashScope 璧板叕鍏?DNS锛堝疄娴嬪伓鍙?UnknownHost / connect timeout锛?
    dns:
      - ${LIANYU_DNS_PRIMARY:-223.5.5.5}
      - ${LIANYU_DNS_SECONDARY:-119.29.29.29}
      - 114.114.114.114
      - ${LIANYU_DNS_FALLBACK:-8.8.8.8}
      - 1.1.1.1
    dns_opt:
      - timeout:1
      - attempts:2
      - rotate
    # 浠呯粦瀹氭湰鏈猴紝閬垮厤鍏綉鏄庢枃 HTTP 缁曡繃 TLS 缃戝叧锛堜簯绔粡 api-gateway:443 鍙嶄唬 backend:8080锛?
    ports:
      - "127.0.0.1:${SERVER_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      milvus:
        condition: service_healthy
      asr:
        condition: service_healthy

  # Agent 杩愯鏃讹紙FastAPI + LangGraph锛宻trangler 闃舵 1锛氭闈㈡劅鐭ョ瓑 agent 閾捐矾锛?
  # 浠呭唴缃戯細缁?api-gateway 鍒嗘祦 /api/agent/**锛屼笉瀵瑰鏆撮湶绔彛
  agent:
    build:
      context: ./backend-agent
      dockerfile: Dockerfile
    image: lianyu-pc/agent:${APP_REVISION:-dev}
    container_name: lianyu-agent
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # 涓?Java lianyu.ai.multimodal.* 鍚屾簮锛歋tage 1 瑙嗚妯″瀷鍑嵁
      LIANYU_AGENT_MULTIMODAL_ENABLED: "true"
      LIANYU_AGENT_MULTIMODAL_BASE_URL: ${MULTIMODAL_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      LIANYU_AGENT_MULTIMODAL_API_KEY: ${MULTIMODAL_API_KEY:-${DASHSCOPE_API_KEY:-}}
      LIANYU_AGENT_MULTIMODAL_MODEL: ${MULTIMODAL_MODEL:-qwen3.7-flash}
      LIANYU_AGENT_SHADOW_MODE: ${LIANYU_AGENT_SHADOW_MODE:-false}
      # 鍙鏁版嵁璁块棶锛堟€荤翰 D7锛夛細memory_search / get_my_recent_life 闇€瑕?
      LIANYU_AGENT_MYSQL_HOST: mysql
      LIANYU_AGENT_MYSQL_PORT: "3306"
      LIANYU_AGENT_MYSQL_USER: ${MYSQL_USER:-lianyu}
      LIANYU_AGENT_MYSQL_PASSWORD: ${MYSQL_PASSWORD:-}
      LIANYU_AGENT_MYSQL_DATABASE: lianyu
      LIANYU_AGENT_REDIS_URL: redis://:${REDIS_PASSWORD:-}@redis:6379/0
      # 璁板繂璇昏矾寰勶細鍚戦噺鍖?+ 閲嶆帓锛圥5锛?
      LIANYU_AGENT_EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      LIANYU_AGENT_EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      LIANYU_AGENT_EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-v3}
      # 鍚戦噺鍖栬窇鍦ㄨ繘绋嬪唴锛坆ge-small-zh-v1.5 ONNX int8锛?12 缁达級锛氬缃?embedding 寰€杩?
      # 0.6鈥?.5s锛屽彫鍥為绠?0.45s 鏍规湰瑁呬笉涓嬶紝鐢熶骇涓婄瓑浜庡悜閲忚矾姘歌繙瓒呮椂銆傛ā鍨嬭蛋鍙鎸傝浇锛?
      # 鎹㈡ā鍨嬪彧鎹㈠涓绘満鐩綍銆佷笉閲嶅缓闀滃儚锛涙敼鍥?dashscope 鍙渶璁捐繖涓彉閲忎负 dashscope銆?
      LIANYU_AGENT_MEMORY_EMBEDDING_BACKEND: ${MEMORY_EMBEDDING_BACKEND:-local}
      LIANYU_AGENT_LOCAL_EMBEDDING_MODEL_DIR: ${MEMORY_EMBEDDING_MODEL_DIR:-/app/models/gte-multilingual-base}
      LIANYU_AGENT_RERANK_API_KEY: ${RERANKER_API_KEY:-}
      LIANYU_AGENT_MILVUS_HOST: milvus
      LIANYU_AGENT_MILVUS_PORT: "19530"
      LIANYU_AGENT_RELAY_ENABLED: ${LIANYU_AGENT_RELAY_ENABLED:-true}
      LIANYU_AGENT_RERANK_BASE_URL: ${RERANKER_BASE_URL:-https://dashscope.aliyuncs.com/api/v1/services/rerank/text-rerank/text-rerank}
      TZ: Asia/Shanghai
    volumes:
      # 鏈湴鍚戦噺妯″瀷锛堢害 24MB锛屽凡 gitignore锛夈€傜洰褰曚笉瀛樺湪鏃跺鍣ㄧ収甯歌捣锛屽悜閲忚矾鑷姩闄嶇骇銆?
      - ./models:/app/models:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    # 瀹夸富鏈?8C/16G锛氭暣鏈哄鍣ㄥ悎璁＄害 4GB銆佽礋杞?0.4鈥?.6锛屼袱瀹炰緥瀹炴祴鍚?0.3鈥?% CPU / 130MB銆?
    # 杩欎簺鏄笂闄愪笉鏄鐣欙紝鍏朵粬椤圭洰瑕佹牳鏃剁収鏍疯兘鎶㈠埌锛涚暀鍑烘湰鍦?embedding锛坆ge-small int8
    # 绾?300MB锛変笌 15k 鏉″洖濉殑绌洪棿锛屽洖濉椂涔熶笉璺熻亰澶╂姠鍚屼竴涓牳銆?
    mem_limit: 3g
    cpus: "3.0"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/agent/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # agent 绗簩涓疄渚嬶細涓?agent 瀹屽叏鍚屾瀯锛屽彧鐢ㄤ簬楂樺彲鐢紙OFF 閫€褰圭殑鍓嶇疆鏉′欢锛?
  agent2:
    build:
      context: ./backend-agent
      dockerfile: Dockerfile
    image: lianyu-pc/agent:${APP_REVISION:-dev}
    container_name: lianyu-agent-2
    restart: unless-stopped
    env_file:
      - .env
    environment:
      LIANYU_AGENT_MULTIMODAL_ENABLED: "true"
      LIANYU_AGENT_MULTIMODAL_BASE_URL: ${MULTIMODAL_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      LIANYU_AGENT_MULTIMODAL_API_KEY: ${MULTIMODAL_API_KEY:-${DASHSCOPE_API_KEY:-}}
      LIANYU_AGENT_MULTIMODAL_MODEL: ${MULTIMODAL_MODEL:-qwen3.7-flash}
      LIANYU_AGENT_SHADOW_MODE: ${LIANYU_AGENT_SHADOW_MODE:-false}
      LIANYU_AGENT_MYSQL_HOST: mysql
      LIANYU_AGENT_MYSQL_PORT: "3306"
      LIANYU_AGENT_MYSQL_USER: ${MYSQL_USER:-lianyu}
      LIANYU_AGENT_MYSQL_PASSWORD: ${MYSQL_PASSWORD:-}
      LIANYU_AGENT_MYSQL_DATABASE: lianyu
      LIANYU_AGENT_REDIS_URL: redis://:${REDIS_PASSWORD:-}@redis:6379/0
      LIANYU_AGENT_EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      LIANYU_AGENT_EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      LIANYU_AGENT_EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-v3}
      # 涓?agent 鍚屾瀯锛氭湰鍦板悜閲忓寲 + 鍙妯″瀷鎸傝浇
      LIANYU_AGENT_MEMORY_EMBEDDING_BACKEND: ${MEMORY_EMBEDDING_BACKEND:-local}
      LIANYU_AGENT_LOCAL_EMBEDDING_MODEL_DIR: ${MEMORY_EMBEDDING_MODEL_DIR:-/app/models/gte-multilingual-base}
      LIANYU_AGENT_RERANK_API_KEY: ${RERANKER_API_KEY:-}
      LIANYU_AGENT_MILVUS_HOST: milvus
      LIANYU_AGENT_MILVUS_PORT: "19530"
      LIANYU_AGENT_RELAY_ENABLED: "false"
      LIANYU_AGENT_RERANK_BASE_URL: ${RERANKER_BASE_URL:-https://dashscope.aliyuncs.com/api/v1/services/rerank/text-rerank/text-rerank}
      TZ: Asia/Shanghai
    volumes:
      - ./models:/app/models:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    # 瀹夸富鏈?8C/16G锛氭暣鏈哄鍣ㄥ悎璁＄害 4GB銆佽礋杞?0.4鈥?.6锛屼袱瀹炰緥瀹炴祴鍚?0.3鈥?% CPU / 130MB銆?
    # 杩欎簺鏄笂闄愪笉鏄鐣欙紝鍏朵粬椤圭洰瑕佹牳鏃剁収鏍疯兘鎶㈠埌锛涚暀鍑烘湰鍦?embedding锛坆ge-small int8
    # 绾?300MB锛変笌 15k 鏉″洖濉殑绌洪棿锛屽洖濉椂涔熶笉璺熻亰澶╂姠鍚屼竴涓牳銆?
    mem_limit: 3g
    cpus: "3.0"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/agent/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # agent 鍐呴儴璐熻浇鍧囪　锛欽ava 鍙璇嗚繖涓湴鍧€锛屼竴涓疄渚嬫寕浜嗚嚜鍔ㄥ垏鍙︿竴涓?
  agent-lb:
    image: nginx:1.27-alpine
    container_name: lianyu-agent-lb
    restart: unless-stopped
    # 浠呯粦鍥炵幆锛氬贰妫€鑴氭湰锛堝涓绘満锛夊彲杈撅紝鍏綉涓嶅彲杈撅紙agent 鍙湇鍔″唴缃戯級
    ports:
      - "127.0.0.1:18001:8001"
    volumes:
      - ./deploy/agent-lb/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - agent
      - agent2
  # 涓枃 ASR锛圫enseVoice final + Zipformer stream锛屼粎鍐呯綉渚?backend 璋冪敤锛?
  asr:
    build:
      context: ./deploy/asr
      dockerfile: Dockerfile
    image: lianyu-pc/asr:${APP_REVISION:-dev}
    container_name: lianyu-asr
    restart: unless-stopped
    environment:
      ASR_THREADS: "2"
      ASR_STREAM_THREADS: "2"
      ASR_STREAM_ENABLED: "true"
      ASR_PORT: "8080"
    # int8 SenseVoice + Zipformer 甯搁┗绾?1.3鈥?.6G锛?G 缁欒瘑鍒嘲鍊肩暀浣欓噺
    mem_limit: 3072m
    cpus: "2.5"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    ports:
      - "127.0.0.1:18081:8080"

  # API 缃戝叧锛堜粎 TLS + /api /ws 鍙嶄唬锛屼笉鎵樼鍓嶇闈欐€佽祫婧愶紱妗岄潰绔蛋 Electron锛?
  api-gateway:
    build:
      context: ./deploy/api-gateway
      dockerfile: Dockerfile
      args:
        APP_REVISION: ${APP_REVISION:-dev}
    image: lianyu-pc/api-gateway:${APP_REVISION:-dev}
    container_name: lianyu-api-gateway
    restart: unless-stopped
    environment:
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,https://localhost}
      # 杩愯惀鍙?dashboard 鍙嶄唬涓婃父锛?ops /static锛沝ashboard 鏈綋涓嶅湪鏈粨搴擄級
      OPS_DASHBOARD_UPSTREAM: ${OPS_DASHBOARD_UPSTREAM:-http://172.18.0.1:8090}
    ports:
      - "${LIANYU_GATEWAY_HTTP_PORT:-80}:80"
      - "${LIANYU_GATEWAY_HTTPS_PORT:-443}:443"
      - "${LIANYU_GATEWAY_UPDATE_HTTPS_PORT:-4443}:4443"
    volumes:
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_started

  mysql:
    image: mysql:8.4
    container_name: lianyu-mysql
    restart: unless-stopped
    # 绌洪棽浼氳瘽 30min 鏈嶅姟绔洖鏀讹紙hikari max-lifetime=20min < 姝ゅ€硷紝鍏煎锛夛細
    # 鍍靛案浜嬪姟锛坕dle in transaction锛変笉鍐嶆寕 8h锛岃嚜鍔ㄥ洖婊氶噴鏀捐閿?
    command: --wait_timeout=1800 --interactive_timeout=1800
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: lianyu
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: lianyu-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: lianyu-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  milvus:
    image: milvusdb/milvus:v2.4.15
    container_name: lianyu-milvus
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_USE_EMBED: "true"
      COMMON_STORAGETYPE: local
    ports:
      - "127.0.0.1:${MILVUS_PORT:-19530}:19530"
      - "127.0.0.1:9091:9091"
    volumes:
      - milvus_data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: lianyu-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
  redis_data:
  rabbitmq_data:
  milvus_data:
  minio_data:
