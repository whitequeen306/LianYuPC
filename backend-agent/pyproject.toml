[project]
name = "lianyu-agent"
version = "0.1.0"
description = "YuNian agent runtime (FastAPI + LangGraph) — strangler migration stage 1"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "langgraph>=0.2.60",
    "langchain-core>=0.3.28",
    # Windows 开发机无系统 IANA 时区库；Linux 镜像自带，显式声明保证两端一致
    "tzdata>=2024.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
