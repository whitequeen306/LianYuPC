[project]
name = "lianyu-agent"
version = "0.1.0"
description = "YuNian agent runtime (FastAPI + LangGraph) — strangler migration stage 1"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "langgraph>=0.2.60",
    "langchain-core>=0.3.28",
    # Windows 开发机无系统 IANA 时区库；Linux 镜像自带，显式声明保证两端一致
    "tzdata>=2024.2",
    # 只读数据访问（总纲 D7）：MySQL 只读查询 + Redis 缓存读取
    "aiomysql>=0.2.0",
    # MySQL 8 默认 caching_sha2_password：aiomysql 需要它才能完成认证
    "cryptography>=42",
    "redis>=5.2",
    # 记忆写路径：向量投影（Python 侧接管 relay）
    "pymilvus>=2.4",
    # 本地向量化：bge-small-zh-v1.5 的 ONNX int8 推理（外网 embedding 往返 0.6–1.5s，
    # 会把召回预算整个吃掉）。onnxruntime 与 tokenizers 加起来约 60MB，不含 torch
    "onnxruntime>=1.20",
    "tokenizers>=0.20",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
